rules:
  - id: go-sql-injection
    languages: [go]
    message: SQL query built with string formatting is vulnerable to SQL injection
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $DB.Query(fmt.Sprintf(..., ...), ...)
          - pattern: $DB.QueryRow(fmt.Sprintf(..., ...), ...)
          - pattern: $DB.Exec(fmt.Sprintf(..., ...), ...)
          - pattern: $DB.Query($STR + ..., ...)
          - pattern: $DB.QueryRow($STR + ..., ...)
          - pattern: $DB.Exec($STR + ..., ...)
    metadata:
      category: go-security
      subcategory:
        - injection
      confidence: HIGH
      impact: CRITICAL
      likelihood: HIGH
      cwe:
        - "CWE-89"
      owasp:
        - "A03:2021 - Injection"
      references:
        - "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"
      description: "Use parameterized queries instead of string concatenation to prevent SQL injection"

  - id: go-sql-injection-prepare
    languages: [go]
    message: SQL statement preparation with string formatting is vulnerable to SQL injection
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $DB.Prepare(fmt.Sprintf(..., ...), ...)
          - pattern: $DB.Prepare($STR + ..., ...)
    metadata:
      category: go-security
      subcategory:
        - injection
      confidence: HIGH
      impact: CRITICAL
      likelihood: HIGH
      cwe:
        - "CWE-89"
      owasp:
        - "A03:2021 - Injection"
