rules:
  - id: go-hardcoded-api-key
    languages: [go]
    message: Hardcoded API key or token detected in source code
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: const $NAME = "..."
          - pattern: var $NAME = "..."
          - pattern: $NAME := "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)(api[_-]?key|api[_-]?token|access[_-]?token|auth[_-]?token|secret[_-]?key|private[_-]?key|password|passwd|pwd)
    metadata:
      category: go-security
      subcategory:
        - hardcoded-secrets
      confidence: HIGH
      impact: CRITICAL
      likelihood: MEDIUM
      cwe:
        - "CWE-798"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      description: "Use environment variables or secure secret management systems instead of hardcoding credentials"

  - id: go-hardcoded-secret-pattern
    languages: [go]
    message: Potential hardcoded secret or credential detected
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              const $VAR = "..."
          - pattern: |
              var $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: "^[A-Za-z0-9+/]{32,}={0,2}$|^[0-9a-f]{32,}$|^[A-Z0-9]{20,}$"
    metadata:
      category: go-security
      subcategory:
        - hardcoded-secrets
      confidence: MEDIUM
      impact: HIGH
      likelihood: LOW
      cwe:
        - "CWE-798"
