rules:
  - id: java-hardcoded-password
    languages: [java]
    message: Hardcoded password in source code is a security risk
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: String $VAR = "...";
          - pattern: final String $VAR = "...";
          - pattern: private static final String $VAR = "...";
          - pattern: public static final String $VAR = "...";
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|pwd|secret|api[_-]?key|apikey|token|auth[_-]?token|access[_-]?token)
      - metavariable-regex:
          metavariable: $VAR
          regex: ^(?!.*\{\{).*$
    metadata:
      category: java-security
      subcategory:
        - credentials
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
      cwe:
        - "CWE-798"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - "https://owasp.org/www-project-top-ten/2017/A3_2017-Sensitive_Data_Exposure"
      description: "Store credentials in environment variables, configuration files, or secure vaults"

  - id: java-hardcoded-jdbc-credentials
    languages: [java]
    message: Hardcoded database credentials in JDBC connection string
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: DriverManager.getConnection("...", "...", "...")
          - pattern: DriverManager.getConnection("jdbc:...password=...")
    metadata:
      category: java-security
      subcategory:
        - credentials
      confidence: HIGH
      impact: CRITICAL
      likelihood: HIGH
      cwe:
        - "CWE-798"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
      description: "Load database credentials from environment variables or secure configuration"

  - id: java-hardcoded-encryption-key
    languages: [java]
    message: Hardcoded encryption key in source code compromises security
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              byte[] $KEY = {...};
          - pattern: String $KEY = "...";
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)(key|secret[_-]?key|encryption[_-]?key|cipher[_-]?key|aes[_-]?key|private[_-]?key)
    metadata:
      category: java-security
      subcategory:
        - credentials
      confidence: MEDIUM
      impact: CRITICAL
      likelihood: MEDIUM
      cwe:
        - "CWE-798"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      references:
        - "https://owasp.org/www-project-top-ten/2017/A3_2017-Sensitive_Data_Exposure"
      description: "Generate and store encryption keys securely using KeyStore or key management systems"
