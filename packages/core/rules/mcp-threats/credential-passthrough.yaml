rules:
  # Credential passthrough: a server-side secret (from process.env) is placed into the
  # Authorization / API-key header of an outbound request whose URL is often
  # user-/model-controlled. This lets a tool leak the server's credentials to an
  # arbitrary destination (the "confused deputy" credential-passthrough problem).
  - id: mcp-credential-passthrough
    languages: [javascript, typescript]
    message: >-
      A server secret from process.env is forwarded into an outbound request auth
      header. MCP tools must not pass server credentials through to arbitrary or
      user-controlled destinations (credential passthrough).
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: 'fetch($URL, {..., headers: {..., Authorization: $V, ...}, ...}, ...)'
          - pattern: 'fetch($URL, {..., headers: {..., "Authorization": $V, ...}, ...}, ...)'
          - pattern: 'fetch($URL, {..., headers: {..., "x-api-key": $V, ...}, ...}, ...)'
          - pattern: '$HTTP.$M($URL, {..., headers: {..., Authorization: $V, ...}, ...}, ...)'
          - pattern: '$HTTP.$M($URL, {..., headers: {..., "Authorization": $V, ...}, ...}, ...)'
      - metavariable-pattern:
          metavariable: $V
          patterns:
            - pattern-either:
                - pattern: process.env.$X
                - pattern: process.env[$X]
                - pattern: '`...${process.env.$X}...`'
                - pattern: '`...${process.env[$X]}...`'
    metadata:
      category: mcp-threats
      subcategory:
        - credential-passthrough
        - confused-deputy
      confidence: medium
      impact: HIGH
      likelihood: MEDIUM
      cwe:
        - "CWE-522"
      owasp:
        - "A01:2021"
