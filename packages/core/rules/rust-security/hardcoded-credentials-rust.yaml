rules:
  - id: rust-hardcoded-api-key
    languages: [rust]
    message: Hardcoded API key or token detected in source code
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              const $NAME: &str = "...";
          - pattern: |
              const $NAME: String = String::from("...");
          - pattern: |
              let $NAME = "...";
          - pattern: |
              static $NAME: &str = "...";
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)(api[_-]?key|api[_-]?token|access[_-]?token|auth[_-]?token|secret[_-]?key|private[_-]?key|password|passwd|pwd|bearer[_-]?token|jwt[_-]?secret)
    metadata:
      category: rust-security
      subcategory:
        - hardcoded-secrets
      confidence: HIGH
      impact: CRITICAL
      likelihood: MEDIUM
      cwe:
        - "CWE-798"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      description: "Use environment variables with std::env::var() or secure secret management systems instead of hardcoding credentials"

  - id: rust-hardcoded-secret-pattern
    languages: [rust]
    message: Potential hardcoded secret or credential detected (base64/hex pattern)
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              const $VAR: &str = "$VALUE";
          - pattern: |
              static $VAR: &str = "$VALUE";
          - pattern: |
              let $VAR = "$VALUE";
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^[A-Za-z0-9+/]{32,}={0,2}$|^[0-9a-f]{32,}$|^[A-Z0-9_]{20,}$
    metadata:
      category: rust-security
      subcategory:
        - hardcoded-secrets
      confidence: MEDIUM
      impact: HIGH
      likelihood: LOW
      cwe:
        - "CWE-798"
      description: "Suspicious long string literal that looks like a secret. Use environment variables or secret management"

  - id: rust-database-password-hardcoded
    languages: [rust]
    message: Database connection string with hardcoded credentials
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              "postgres://$USER:$PASS@..."
          - pattern: |
              "postgresql://$USER:$PASS@..."
          - pattern: |
              "mysql://$USER:$PASS@..."
          - pattern: |
              "mongodb://$USER:$PASS@..."
    metadata:
      category: rust-security
      subcategory:
        - hardcoded-secrets
      confidence: HIGH
      impact: CRITICAL
      likelihood: MEDIUM
      cwe:
        - "CWE-798"
      description: "Never hardcode database credentials. Use environment variables or configuration files outside version control"
