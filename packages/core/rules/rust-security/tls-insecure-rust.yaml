rules:
  - id: rust-tls-accept-invalid-certs
    languages: [rust]
    message: TLS certificate verification is disabled, enabling man-in-the-middle attacks
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              $CLIENT.danger_accept_invalid_certs(true)
          - pattern: |
              danger_accept_invalid_certs(true)
          - pattern: |
              $CLIENT.accept_invalid_certs(true)
    metadata:
      category: rust-security
      subcategory:
        - tls-security
      confidence: HIGH
      impact: CRITICAL
      likelihood: HIGH
      cwe:
        - "CWE-295"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - "https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html#method.danger_accept_invalid_certs"
      description: "Never disable TLS certificate verification in production. It exposes connections to MITM attacks"

  - id: rust-tls-accept-invalid-hostnames
    languages: [rust]
    message: TLS hostname verification is disabled, enabling man-in-the-middle attacks
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              $CLIENT.danger_accept_invalid_hostnames(true)
          - pattern: |
              danger_accept_invalid_hostnames(true)
    metadata:
      category: rust-security
      subcategory:
        - tls-security
      confidence: HIGH
      impact: CRITICAL
      likelihood: MEDIUM
      cwe:
        - "CWE-295"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      description: "Hostname verification is essential for TLS security. Disabling it allows impersonation attacks"

  - id: rust-native-tls-no-verification
    languages: [rust]
    message: TLS connector configured without certificate verification
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              TlsConnector::builder().danger_accept_invalid_certs(true)
          - pattern: |
              TlsConnector::new().danger_accept_invalid_certs(true)
    metadata:
      category: rust-security
      subcategory:
        - tls-security
      confidence: HIGH
      impact: CRITICAL
      likelihood: MEDIUM
      cwe:
        - "CWE-295"
      description: "Always verify TLS certificates. For testing, use a local CA or self-signed certs with proper configuration"

  - id: rust-http-instead-of-https
    languages: [rust]
    message: HTTP URL used instead of HTTPS for potentially sensitive communication
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              "http://..."
          - pattern: |
              reqwest::get("http://...")
          - pattern: |
              $CLIENT.get("http://...")
      - pattern-not: |
          "http://localhost..."
      - pattern-not: |
          "http://127.0.0.1..."
    metadata:
      category: rust-security
      subcategory:
        - tls-security
      confidence: MEDIUM
      impact: MEDIUM
      likelihood: MEDIUM
      cwe:
        - "CWE-319"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      description: "Use HTTPS for all external communication to protect data in transit"
