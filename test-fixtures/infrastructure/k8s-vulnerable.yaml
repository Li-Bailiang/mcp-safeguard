apiVersion: v1
kind: Pod
metadata:
  name: vulnerable-pod
spec:
  # Missing security context
  hostNetwork: true
  serviceAccountName: default

  containers:
  - name: app
    image: nginx:latest

    # Secret directly in env
    env:
    - name: DATABASE_PASSWORD
      value: "hardcoded-secret-123"
    - name: API_TOKEN
      value: "Bearer abc123xyz"

    # No resource limits

    # Privileged container
    securityContext:
      privileged: true
      runAsUser: 0

    # Host path mount
    volumeMounts:
    - name: host-mount
      mountPath: /host

  volumes:
  - name: host-mount
    hostPath:
      path: /
      type: Directory

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: overly-permissive
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

---
apiVersion: v1
kind: Service
metadata:
  name: test-service
spec:
  ports:
  - port: 80
  selector:
    app: test
